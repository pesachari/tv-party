<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Party 🎮</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070a17; color: #fff; overflow: hidden;
    font-family: "Segoe UI", Roboto, Arial, sans-serif; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; display: block; }
  #lobby { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 1.15fr; grid-template-rows: auto 1fr auto;
    gap: 2vh 3vw; padding: 3vh 4vw 4.5vh; background: radial-gradient(circle at 20% 10%, #2b2f7a 0%, #0b1026 55%, #070a17 100%); }
  #lobby[hidden] { display: none; }
  h1 { grid-column: 1 / -1; margin: 0; font-size: 5.2vh; letter-spacing: .02em; }
  h1 span { background: linear-gradient(90deg, #ff4d6d, #fcc419, #51cf66, #4dabf7); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 3vh; padding: 3vh; }
  #joinBox { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6vh; text-align: center; }
  #qr { width: 30vh; height: 30vh; background: #fff; border-radius: 2vh; padding: 1.4vh; display: grid; place-items: center; color: #000; font-size: 2vh; }
  #qr img { width: 100%; height: 100%; image-rendering: pixelated; }
  .big { font-size: 3vh; opacity: .9; }
  #code { font-size: 9vh; font-weight: 800; letter-spacing: .25em; direction: ltr; line-height: 1; }
  #url { font-size: 2vh; opacity: .65; direction: ltr; word-break: break-all; }
  #playersBox h2, #gamesRow h2 { margin: 0 0 2vh; font-size: 3.4vh; }
  #players { display: flex; flex-wrap: wrap; gap: 1.6vh; }
  .chip { display: flex; align-items: center; gap: 1.2vh; padding: 1.3vh 2.2vh; border-radius: 99px; font-size: 3vh; font-weight: 700;
    background: rgba(255,255,255,.1); }
  .chip i { width: 2.6vh; height: 2.6vh; border-radius: 50%; display: inline-block; }
  .chip.off { opacity: .35; }
  .empty { font-size: 2.8vh; opacity: .6; }
  #gamesRow { grid-column: 1 / -1; }
  #games { display: grid; grid-template-columns: repeat(8, 1fr); gap: 1vw; }
  .g { padding: 1.4vh .6vw; border-radius: 2.4vh; background: rgba(255,255,255,.08); text-align: center; }
  .g .ic { font-size: 5vh; }
  .g b { display: block; font-size: 2.5vh; margin-top: .6vh; }
  .g small { display: block; font-size: 1.6vh; opacity: .7; margin-top: .6vh; }
  #musicHint { position: fixed; bottom: 3vh; left: 50%; transform: translateX(-50%); padding: 1.2vh 2.4vh; border-radius: 99px; background: #fcc419; color: #2b1d00; font-size: 2.4vh; font-weight: 800; z-index: 5; animation: pulse 1.6s infinite; }
  #musicHint[hidden] { display: none; }
  @keyframes pulse { 50% { transform: translateX(-50%) scale(1.06); } }
  #status { position: fixed; bottom: .8vh; left: 1vw; font-size: 1.8vh; opacity: .55; direction: rtl; }
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>

<div id="lobby">
  <h1>🎮 <span>TV Party</span></h1>
  <div id="joinBox" class="card">
    <div class="big">סרקו עם הטלפון כדי להצטרף</div>
    <div id="qr">טוען…</div>
    <div class="big">או היכנסו לכתובת והקלידו את הקוד:</div>
    <div id="code">----</div>
    <div id="url"></div>
  </div>
  <div id="playersBox" class="card">
    <h2>שחקנים</h2>
    <div id="players"></div>
    <p class="big" id="hostHint" style="margin-top:3vh"></p>
  </div>
  <div id="gamesRow">
    <div id="games"></div>
  </div>
</div>
<div id="musicHint" hidden>🔊 לחצו OK בשלט של הטלוויזיה כדי להפעיל מוזיקה</div>
<div id="status"></div>

<script>
'use strict';
// ====================================================================== setup
const W = 1920, H = 1080;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const lobbyEl = $('lobby');

const COLORS = ['#ff4d6d', '#4dabf7', '#51cf66', '#fcc419', '#cc5de8', '#ff922b', '#22b8cf', '#f783ac'];
const params = new URLSearchParams(location.search);
const LOCAL = params.has('local');            // test mode: BroadcastChannel instead of internet
const PREFIX = 'tvparty-k3x-';
const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const randomCode = () => Array.from({ length: 4 }, () => ALPHA[Math.floor(Math.random() * ALPHA.length)]).join('');
let code = (params.get('code') || randomCode()).toUpperCase();

const players = new Map();   // id -> player
let hostId = null;
let state = 'lobby';         // lobby | game | results
let current = null;
let resultData = null, resultsUntil = 0, resultTitle = '';

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const connected = () => [...players.values()].filter(p => p.connected);
const cleanName = s => String(s || '').replace(/[<>&"]/g, '').trim().slice(0, 12) || 'שחקן';
const nextColor = () => { const used = new Set([...players.values()].map(p => p.color)); return COLORS.find(c => !used.has(c)) || COLORS[players.size % COLORS.length]; };
let botN = 0;
const makeBot = name => ({ id: 'bot' + (++botN), name, color: '#adb5bd', bot: true, connected: false });
function setStatus(s) { $('status').textContent = s; }

// ====================================================================== network
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}

function startNet() {
  if (LOCAL) {
    const bc = new BroadcastChannel(PREFIX + code);
    const sends = new Map();
    bc.onmessage = e => {
      const m = e.data; if (!m || m.to !== 'tv') return;
      if (!sends.has(m.from)) sends.set(m.from, d => bc.postMessage({ to: m.from, from: 'tv', data: d }));
      handleMsg(m.from, m.data, sends.get(m.from));
    };
    setStatus('מצב בדיקה מקומי');
    return;
  }
  setStatus('מתחבר לשרת…');
  loadScript('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js').then(() => {
    const peer = new Peer(PREFIX + code.toLowerCase(), { debug: 0 });
    peer.on('open', () => setStatus('מוכן ✓'));
    peer.on('error', err => {
      if (err.type === 'unavailable-id') { peer.destroy(); code = randomCode(); renderLobby(); startNet(); }
      else setStatus('שגיאת חיבור: ' + err.type);
    });
    peer.on('disconnected', () => { setStatus('מתחבר מחדש…'); try { peer.reconnect(); } catch (e) {} });
    peer.on('connection', conn => {
      let pid = null;
      const send = d => { if (conn.open) conn.send(d); };
      conn.on('data', d => { if (d && d.t === 'join') pid = String(d.id || '').slice(0, 40); handleMsg(pid, d, send); });
      conn.on('close', () => dropPlayer(pid, send));
      conn.on('error', () => dropPlayer(pid, send));
    });
  }).catch(() => setStatus('לא ניתן לטעון את רכיב החיבור – בדקו את האינטרנט'));
}

function handleMsg(pid, m, sendFn) {
  if (!m || !pid) return;
  if (m.t === 'join') {
    let p = players.get(pid);
    if (!p) {
      if (connected().length >= 8) { sendFn({ t: 'full' }); return; }
      p = { id: pid, name: cleanName(m.name), color: nextColor(), wins: 0 };
      players.set(pid, p);
    }
    p.name = cleanName(m.name); p.send = sendFn; p.connected = true;
    ensureHost();
    sendFn({ t: 'welcome', color: p.color, name: p.name });
    renderLobby(); syncControllers();
    return;
  }
  const p = players.get(pid);
  if (!p || !p.connected) return;
  if (m.t === 'pick' && pid === hostId && state === 'lobby') startGame(m.game);
  else if (m.t === 'quit' && pid === hostId && state !== 'lobby') backToLobby();
  else if (m.t === 'music' && pid === hostId) { Music.unlock(); Music.toggle(); updateMusicHint(); syncControllers(); }
  else if (m.t === 'in' && state === 'game' && current && current.cd <= 0) current.input(p, m);
}

function dropPlayer(pid, sendFn) {
  const p = players.get(pid);
  if (!p || p.send !== sendFn) return;
  p.connected = false; p.send = null;
  if (state === 'lobby') players.delete(pid);
  ensureHost(); renderLobby(); syncControllers();
}

function ensureHost() {
  const h = players.get(hostId);
  if (!h || !h.connected) { const c = connected()[0]; hostId = c ? c.id : null; }
}

function send(p, obj) { if (p && p.connected && p.send) { try { p.send(obj); } catch (e) {} } }
function sendUI(p, ui) { send(p, Object.assign({ t: 'ui', host: p.id === hostId, inGame: state !== 'lobby', music: Music.enabled }, ui)); }
function syncControllers() { for (const p of connected()) sendUI(p, uiFor(p)); }
function uiFor(p) {
  if (state === 'lobby') {
    if (p.id === hostId) return { ui: 'menu', games: GAMES.map(g => ({ id: g.id, name: g.name, icon: g.icon, desc: g.desc })) };
    const h = players.get(hostId);
    return { ui: 'wait', text: `${h ? h.name : 'המארח'} בוחר/ת משחק… 🎮` };
  }
  if (state === 'results') return { ui: 'wait', text: 'סוף המשחק! 🏆 תסתכלו על המסך' };
  return (current && current.uiFor(p)) || { ui: 'wait', text: 'המשחק התחיל – הפעם אתם צופים 👀' };
}

// ====================================================================== lobby
function renderLobby() {
  $('code').textContent = code;
  const base = location.href.split('?')[0].replace(/index\.html$/, '');
  const joinUrl = base + 'play.html?code=' + code + (LOCAL ? '&local' : '');
  $('url').textContent = joinUrl.replace(/^https?:\/\//, '').replace(/\?.*$/, '');
  if (renderLobby.qrFor !== joinUrl) {
    renderLobby.qrFor = joinUrl;
    makeQR(joinUrl).then(src => { $('qr').innerHTML = src ? `<img alt="QR" src="${src}">` : 'אין QR – השתמשו בכתובת'; });
  }
  const box = $('players'); box.innerHTML = '';
  const list = [...players.values()];
  if (!list.length) box.innerHTML = '<div class="empty">עוד אין שחקנים… סרקו את הקוד 📱</div>';
  for (const p of list) {
    const d = document.createElement('div');
    d.className = 'chip' + (p.connected ? '' : ' off');
    d.innerHTML = `<i style="background:${p.color}"></i>${p.id === hostId ? '👑 ' : ''}${p.name}${p.wins ? ` · 🏆${p.wins}` : ''}`;
    box.appendChild(d);
  }
  const h = players.get(hostId);
  $('hostHint').textContent = h ? `👑 ${h.name} בוחר/ת את המשחק בטלפון` : '';
  const gb = $('games');
  if (!gb.childElementCount) for (const g of GAMES) {
    const d = document.createElement('div'); d.className = 'g';
    d.innerHTML = `<div class="ic">${g.icon}</div><b>${g.name}</b><small>${g.desc}</small>`;
    gb.appendChild(d);
  }
}

function makeQR(text) {
  const draw = () => { try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createDataURL(10, 1); } catch (e) { return null; } };
  if (window.qrcode) return Promise.resolve(draw());
  return loadScript('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js').then(draw).catch(() => null);
}

// ====================================================================== game flow
function startGame(id) {
  const g = GAMES.find(x => x.id === id);
  const ps = connected();
  if (!g || !ps.length) return;
  current = g.create(ps);
  current.def = g; current.cd = 3.5;
  state = 'game'; lobbyEl.hidden = true;
  Music.play(g.id);
  syncControllers();
}

function finishGame(ranking) {
  state = 'results';
  resultData = ranking; resultTitle = current.def.name;
  resultsUntil = performance.now() + 8000;
  Music.play('results');
  const top = ranking[0];
  if (top && top.p && !top.p.bot && players.has(top.p.id)) top.p.wins = (top.p.wins || 0) + 1;
  ranking.forEach((r, i) => send(r.p, { t: 'buzz', ms: i === 0 ? [90, 60, 90, 60, 90] : 60 }));
  syncControllers();
}

function backToLobby() {
  state = 'lobby'; current = null;
  for (const [id, p] of players) if (!p.connected) players.delete(id);
  ensureHost();
  lobbyEl.hidden = false;
  Music.play('lobby');
  renderLobby(); syncControllers();
}

let last = performance.now();
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (state === 'game' && current) {
    try {
      if (current.cd > 0) current.cd -= dt; else current.update(dt);
      if (current.result) finishGame(current.result);   // go straight to the results – don't draw a frame past the end
      else { ctx.save(); current.draw(); ctx.restore(); if (current.cd > 0) drawCountdown(current.cd); }
    } catch (e) { console.error(e); ctx.restore(); }
  } else if (state === 'results') {
    drawResults(t);
    if (t > resultsUntil) backToLobby();
  }
  requestAnimationFrame(loop);
}

// ====================================================================== drawing helpers
const FONT = '"Segoe UI", Roboto, Arial, sans-serif';
function T(s, x, y, size, color = '#fff', align = 'center', weight = 700) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.direction = 'rtl';
  ctx.fillText(String(s), x, y);
}
function bg(c1 = '#0b1026', c2 = '#1d2550') {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function rrect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrapLines(s, maxW, size, weight = 700) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  const words = String(s).split(' '); const lines = []; let line = '';
  for (const w of words) { const test = line ? line + ' ' + w : w; if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
  if (line) lines.push(line);
  return lines;
}
function chips(items, y) {   // items: [{p, text}]
  ctx.font = `700 30px ${FONT}`;
  const widths = items.map(it => ctx.measureText(`${it.p.name}  ${it.text}`).width + 70);
  const total = widths.reduce((a, b) => a + b, 0) + (items.length - 1) * 18;
  let x = W / 2 + total / 2;   // RTL: start from the right
  items.forEach((it, i) => {
    const w = widths[i]; x -= w;
    ctx.globalAlpha = it.dim ? 0.35 : 1;
    rrect(x, y - 28, w, 56, 28); ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fill();
    ctx.fillStyle = it.p.color; ctx.beginPath(); ctx.arc(x + w - 30, y, 12, 0, Math.PI * 2); ctx.fill();
    T(`${it.p.name}  ${it.text}`, x + w - 52, y, 30, '#fff', 'right');
    ctx.globalAlpha = 1;
    x -= 18;
  });
}
function drawCountdown(cd) {
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
  const n = Math.ceil(cd - 0.5);
  const k = 1 + (cd % 1) * 0.35;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(k, k);
  T(n > 0 ? n : 'יאללה!', 0, 0, n > 0 ? 260 : 190, '#fff');
  ctx.restore();
  T(current.def.icon + ' ' + current.def.name, W / 2, H / 2 + 230, 60, 'rgba(255,255,255,.85)');
}
function drawResults(t) {
  bg('#1a1240', '#3b1d5e');
  T('🏆 תוצאות – ' + resultTitle, W / 2, 130, 84);
  const rows = resultData.slice(0, 8);
  rows.forEach((r, i) => {
    const y = 270 + i * 92, x = W / 2 - 520, w = 1040;
    rrect(x, y - 38, w, 76, 38);
    ctx.fillStyle = i === 0 ? 'rgba(252,196,25,.28)' : 'rgba(255,255,255,.09)'; ctx.fill();
    T(['🥇', '🥈', '🥉'][i] || `${i + 1}.`, x + w - 50, y, 46, '#fff');
    ctx.fillStyle = r.p.color; ctx.beginPath(); ctx.arc(x + w - 115, y, 16, 0, Math.PI * 2); ctx.fill();
    T(r.p.name, x + w - 150, y, 42, '#fff', 'right');
    T(r.label || '', x + 40, y, 36, 'rgba(255,255,255,.85)', 'left', 600);
  });
  T(`חוזרים ללובי בעוד ${Math.max(0, Math.ceil((resultsUntil - t) / 1000))}…`, W / 2, H - 60, 32, 'rgba(255,255,255,.6)');
}

// ====================================================================== GAME 1: light cycles
function createTron(ps) {
  const CW = 20, GW = 96, GH = 54, STEP = 0.075;
  const D = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] }, OPP = { u: 'd', d: 'u', l: 'r', r: 'l' };
  const spawns = [[8, 14, 'r'], [87, 40, 'l'], [8, 40, 'r'], [87, 14, 'l'], [30, 5, 'd'], [65, 48, 'u'], [65, 5, 'd'], [30, 48, 'u']];
  const list = ps.map(p => ({ p }));
  if (list.length === 1) list.push({ p: makeBot('מחשב') });
  const grid = new Int16Array(GW * GH).fill(-1);
  list.forEach((c, i) => { const s = spawns[i]; Object.assign(c, { i, x: s[0], y: s[1], dir: s[2], next: s[2], alive: true }); grid[c.y * GW + c.x] = i; });
  const humans = list.filter(c => !c.p.bot);
  const free = (x, y) => x >= 0 && y >= 0 && x < GW && y < GH && grid[y * GW + x] < 0;
  let acc = 0, time = 0; const deaths = [];

  function botThink(c) {
    const opts = ['u', 'd', 'l', 'r'].filter(d => d !== OPP[c.dir]);
    const safe = (d, n) => { for (let k = 1; k <= n; k++) if (!free(c.x + D[d][0] * k, c.y + D[d][1] * k)) return false; return true; };
    if (safe(c.dir, 3) && Math.random() > 0.05) return;
    let pick = opts.filter(d => safe(d, 3));
    if (!pick.length) pick = opts.filter(d => safe(d, 1));
    if (pick.length) c.next = pick[Math.floor(Math.random() * pick.length)];
  }

  function tick() {
    const alive = list.filter(c => c.alive);
    alive.forEach(c => { if (c.p.bot) botThink(c); c.dir = c.next; c.nx = c.x + D[c.dir][0]; c.ny = c.y + D[c.dir][1]; });
    const dying = new Set();
    alive.forEach(c => { if (!free(c.nx, c.ny)) dying.add(c); });
    for (let a = 0; a < alive.length; a++) for (let b = a + 1; b < alive.length; b++)
      if (alive[a].nx === alive[b].nx && alive[a].ny === alive[b].ny) { dying.add(alive[a]); dying.add(alive[b]); }
    alive.forEach(c => {
      if (dying.has(c)) { c.alive = false; c.deathT = time; deaths.push(c); send(c.p, { t: 'buzz', ms: 250 }); }
      else { c.x = c.nx; c.y = c.ny; grid[c.y * GW + c.x] = c.i; }
    });
    const still = list.filter(c => c.alive);
    if (still.length <= 1 || humans.every(c => !c.alive)) {
      const order = [...still, ...deaths.slice().reverse()].filter(c => !c.p.bot);
      g.result = order.map(c => ({ p: c.p, label: c.alive ? 'שרד/ה עד הסוף! 🏁' : `שרד/ה ${c.deathT.toFixed(1)} שניות` }));
    }
  }

  const g = {
    uiFor: p => list.some(c => c.p === p) ? { ui: 'dpad' } : null,
    input(p, m) { const c = list.find(c => c.p === p); if (c && c.alive && D[m.d] && m.d !== OPP[c.dir]) c.next = m.d; },
    update(dt) { time += dt; acc += dt; while (acc >= STEP && !g.result) { acc -= STEP; tick(); } },
    draw() {
      bg('#05070f', '#0b1530');
      ctx.strokeStyle = 'rgba(80,140,255,.07)'; ctx.lineWidth = 1;
      for (let x = 0; x <= GW; x += 4) { ctx.beginPath(); ctx.moveTo(x * CW, 0); ctx.lineTo(x * CW, H); ctx.stroke(); }
      for (let y = 0; y <= GH; y += 4) { ctx.beginPath(); ctx.moveTo(0, y * CW); ctx.lineTo(W, y * CW); ctx.stroke(); }
      for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
        const o = grid[y * GW + x]; if (o < 0) continue;
        const c = list[o]; ctx.fillStyle = c.p.color; ctx.globalAlpha = c.alive ? 0.8 : 0.3;
        ctx.fillRect(x * CW + 2, y * CW + 2, CW - 4, CW - 4);
      }
      ctx.globalAlpha = 1;
      for (const c of list) {
        if (!c.alive) continue;
        ctx.shadowColor = c.p.color; ctx.shadowBlur = 25; ctx.fillStyle = '#fff';
        ctx.fillRect(c.x * CW, c.y * CW, CW, CW); ctx.shadowBlur = 0;
        if (time < 3) T(c.p.name, c.x * CW + CW / 2, c.y * CW - 22, 30, c.p.color);
      }
      ctx.strokeStyle = 'rgba(120,170,255,.6)'; ctx.lineWidth = 6; ctx.strokeRect(3, 3, W - 6, H - 6);
    },
  };
  return g;
}

// ====================================================================== GAME 2: pong
function createPong(ps) {
  const humans = ps.slice(0, 4);
  const pads = [];
  const mk = (p, side, idx) => ({ p, side, x: side === 'L' ? (idx ? 260 : 70) : (idx ? W - 260 : W - 70), y: H / 2, ty: H / 2, h: 210 });
  const L = humans.filter((_, i) => i % 2 === 0), R = humans.filter((_, i) => i % 2 === 1);
  L.forEach((p, i) => pads.push(mk(p, 'L', i)));
  R.forEach((p, i) => pads.push(mk(p, 'R', i)));
  if (!R.length) pads.push(mk(makeBot('מחשב'), 'R', 0));
  const score = { L: 0, R: 0 }, TARGET = 5;
  let ball, serveT = 0, flash = 0;
  function serve(dir) { const a = rand(-0.45, 0.45); ball = { x: W / 2, y: H / 2, vx: Math.cos(a) * 680 * dir, vy: Math.sin(a) * 680, r: 17 }; serveT = 1.1; }
  serve(Math.random() < 0.5 ? 1 : -1);
  function point(side) {
    score[side]++; flash = 0.6;
    pads.forEach(pd => send(pd.p, { t: 'buzz', ms: pd.side === side ? 80 : 200 }));
    if (score[side] >= TARGET) {
      const win = pads.filter(pd => pd.side === side), lose = pads.filter(pd => pd.side !== side);
      const txt = `${score.L} : ${score.R}`;
      g.result = [...win.map(pd => ({ p: pd.p, label: 'ניצחון ' + txt })), ...lose.map(pd => ({ p: pd.p, label: 'הפסד ' + txt }))].filter(r => !r.p.bot);
      if (!g.result.length || g.result[0].label.startsWith('הפסד')) g.result.unshift({ p: { name: 'המחשב', color: '#adb5bd', bot: true }, label: 'ניצחון ' + txt });
      return;
    }
    serve(side === 'L' ? -1 : 1);
  }
  const g = {
    uiFor(p) { const pd = pads.find(pd => pd.p === p); return pd ? { ui: 'slider', text: pd.side === 'L' ? 'אתם בצד שמאל ⬅️' : 'אתם בצד ימין ➡️' } : null; },
    input(p, m) { if (typeof m.v !== 'number') return; pads.filter(pd => pd.p === p).forEach(pd => pd.ty = clamp(m.v, 0, 1) * (H - pd.h) + pd.h / 2); },
    update(dt) {
      flash = Math.max(0, flash - dt);
      for (const pd of pads) {
        if (pd.p.bot) { const target = ball.vx > 0 ? ball.y : H / 2; const max = 520 * dt; pd.y += clamp(target - pd.y, -max, max); }
        else pd.y += (pd.ty - pd.y) * Math.min(1, dt * 20);
        pd.y = clamp(pd.y, pd.h / 2, H - pd.h / 2);
      }
      if (serveT > 0) { serveT -= dt; return; }
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
      if (ball.y > H - ball.r) { ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy); }
      for (const pd of pads) {
        const dir = pd.side === 'L' ? 1 : -1;
        if (Math.sign(ball.vx) === dir) continue;
        if (Math.abs(ball.x - pd.x) < 14 + ball.r && Math.abs(ball.y - pd.y) < pd.h / 2 + ball.r) {
          const off = clamp((ball.y - pd.y) / (pd.h / 2), -1, 1);
          const sp = Math.min(1900, Math.hypot(ball.vx, ball.vy) * 1.07);
          ball.vx = Math.cos(off * 0.95) * sp * dir; ball.vy = Math.sin(off * 0.95) * sp;
          ball.x = pd.x + dir * (14 + ball.r);
          send(pd.p, { t: 'buzz', ms: 30 });
        }
      }
      if (ball.x < -60) point('R'); else if (ball.x > W + 60) point('L');
    },
    draw() {
      bg('#06121f', '#0d2b3e');
      if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.25})`; ctx.fillRect(0, 0, W, H); }
      ctx.setLineDash([24, 26]); ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke(); ctx.setLineDash([]);
      T(score.L, W / 2 - 160, 120, 140, 'rgba(255,255,255,.85)');
      T(score.R, W / 2 + 160, 120, 140, 'rgba(255,255,255,.85)');
      for (const pd of pads) {
        ctx.shadowColor = pd.p.color; ctx.shadowBlur = 30; ctx.fillStyle = pd.p.color;
        rrect(pd.x - 14, pd.y - pd.h / 2, 28, pd.h, 14); ctx.fill(); ctx.shadowBlur = 0;
        T(pd.p.name, pd.x + (pd.side === 'L' ? 30 : -30), pd.y - pd.h / 2 - 26, 28, pd.p.color, pd.side === 'L' ? 'left' : 'right');
      }
      if (serveT <= 0 || Math.floor(serveT * 6) % 2 === 0) {
        ctx.shadowColor = '#fff'; ctx.shadowBlur = 30; ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      }
      T(`ראשון ל-${TARGET} מנצח`, W / 2, H - 40, 28, 'rgba(255,255,255,.45)');
    },
  };

}

  ['מצרים', 'קהיר'], ['יפן', 'טוקיו'], ['סין', 'בייג׳ינג'], ['הודו', 'ניו דלהי'], ['רוסיה', 'מוסקבה'], ['קנדה', 'אוטווה'],

  ['טורקיה', 'אנקרה'], ['הולנד', 'אמסטרדם'], ['בלגיה', 'בריסל'], ['שוודיה', 'שטוקהולם'], ['נורווגיה', 'אוסלו'], ['דנמרק', 'קופנהגן'],
  ['פינלנד', 'הלסינקי'], ['פולין', 'ורשה'], ['אוקראינה', 'קייב'], ['אוסטריה', 'וינה'], ['שווייץ', 'ברן'], ['הונגריה', 'בודפשט'],
  ['צ׳כיה', 'פראג'], ['אירלנד', 'דבלין'], ['בריטניה', 'לונדון'], ['דרום קוריאה', 'סיאול'], ['תאילנד', 'בנגקוק'], ['ירדן', 'עמאן'],
  ['קפריסין', 'ניקוסיה'], ['קניה', 'ניירובי'], ['ניגריה', 'אבוג׳ה'], ['מרוקו', 'רבאט'], ['ניו זילנד', 'ולינגטון'],
];
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function genCapital() {
  const [country, cap] = CAPITALS[ri(0, CAPITALS.length - 1)];
  const wrong = shuffle(CAPITALS.filter(c => c[1] !== cap).map(c => c[1])).slice(0, 3);
  return [`מהי עיר הבירה של ${country}?`, cap, ...wrong];
}
function genMath() {
  let q, ans;
  const kind = ri(0, 3);
  if (kind === 0) { const a = ri(6, 15), b = ri(3, 12); q = `כמה זה ${a} × ${b}?`; ans = a * b; }
  else if (kind === 1) { const a = ri(120, 899), b = ri(110, 899); q = `כמה זה ${a} + ${b}?`; ans = a + b; }
  else if (kind === 2) { const a = ri(300, 999), b = ri(101, a - 50); q = `כמה זה ${a} − ${b}?`; ans = a - b; }
  else { const pct = [10, 20, 25, 50, 75][ri(0, 4)], base = ri(2, 20) * 20; q = `כמה זה ${pct}% מתוך ${base}?`; ans = base * pct / 100; }
  const wrong = new Set();
  const deltas = kind === 0 ? [-ri(1, 3) * 1, ri(1, 3), 10, -10, ri(4, 9)] : [10, -10, 1, -1, 100, -100, 2, 20];
  for (const d of shuffle(deltas)) { const v = ans + d; if (v > 0 && v !== ans) wrong.add(v); if (wrong.size === 3) break; }
  while (wrong.size < 3) wrong.add(ans + ri(2, 30));
  return [q, String(ans), ...[...wrong].map(String)];
}
function pickQuestions(n) {
  let seen = [];
  try { seen = JSON.parse(localStorage.getItem('tvp-seenQ') || '[]'); } catch (e) {}
  const seenSet = new Set(seen);
  const staticN = n - 4;
  let pool = QUESTIONS.filter(q => !seenSet.has(q[0]));
  if (pool.length < staticN) { seen = []; pool = QUESTIONS.slice(); }
  const chosen = shuffle(pool).slice(0, staticN);
  try { localStorage.setItem('tvp-seenQ', JSON.stringify(seen.concat(chosen.map(q => q[0])))); } catch (e) {}
  const caps = new Set(); const list = chosen.slice();
  while (caps.size < 2) { const q = genCapital(); if (!caps.has(q[0])) { caps.add(q[0]); list.push(q); } }
  list.push(genMath(), genMath());
  return shuffle(list);
}


function createQuiz(ps) {
  const QT = 15;
  const qs = pickQuestions(10).map(([q, c, ...w]) => { const opts = shuffle([c, ...w]); return { q, opts, ans: opts.indexOf(c) }; });
  const scores = new Map(ps.map(p => [p, 0]));
  let i = 0, phase = 'q', t = 0, answers = new Map();

    for (const p of scores.keys()) { sendUI(p, g.uiFor(p)); const a = answers.get(p); send(p, { t: 'buzz', ms: a && a.pts ? [50, 40, 50] : 200 }); }
  }

    if (i + 1 >= qs.length) { g.result = [...scores].sort((a, b) => b[1] - a[1]).map(([p, s]) => ({ p, label: `${s.toLocaleString()} נק׳` })); return; }
    i++; phase = 'q'; t = 0; answers = new Map();
    for (const p of scores.keys()) sendUI(p, g.uiFor(p));
  }
  const g = {
    uiFor(p) {
      if (!scores.has(p)) return null;
      const Q = qs[i];

      const a = answers.get(p);
      return { ui: 'wait', text: !a ? '⌛ לא הספקת לענות' : a.a === Q.ans ? `✅ נכון! +${a.pts}` : '❌ לא נכון' };
    },
    input(p, m) {
      if (phase !== 'q' || !scores.has(p) || answers.has(p)) return;
      const a = m.a | 0; if (a < 0 || a > 3) return;

      answers.set(p, { a, pts });

      if (everyoneAnswered()) reveal();
    },
    update(dt) { t += dt; if (phase === 'q' && t >= QT) reveal(); else if (phase === 'r' && t >= 4.5) next(); },
    draw() {

      const Q = qs[i];
      T(`שאלה ${i + 1} מתוך ${qs.length}`, W / 2, 60, 34, 'rgba(255,255,255,.7)');
      const lines = wrapLines(Q.q, 1600, 70);
      lines.forEach((ln, k) => T(ln, W / 2, 170 + k * 84 - (lines.length - 1) * 42, 70));
      if (phase === 'q') {
        const frac = clamp(1 - t / QT, 0, 1);
        rrect(160, 300, 1600, 22, 11); ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fill();
        rrect(160 + 1600 * (1 - frac), 300, 1600 * frac, 22, 11); ctx.fillStyle = frac > 0.3 ? '#51cf66' : '#ff6b6b'; ctx.fill();
      }
      for (let k = 0; k < 4; k++) {
        const col = k % 2, row = k >> 1;
        const w = 780, h = 230, x = W / 2 + 10 + (col === 0 ? 0 : -(w + 20)), y = 370 + row * (h + 24);
        const correct = k === Q.ans;

        if (phase === 'r' && correct) { ctx.lineWidth = 10; ctx.strokeStyle = '#fff'; ctx.stroke(); }
        T(QSHAPE[k], x + w - 60, y + h / 2, 60, 'rgba(255,255,255,.9)');
        const ol = wrapLines(Q.opts[k], w - 170, 52);
        ol.slice(0, 2).forEach((ln, j) => T(ln, x + w - 120, y + h / 2 + (j - (Math.min(ol.length, 2) - 1) / 2) * 60, 52, '#fff', 'right'));
        if (phase === 'r') {
          const who = [...answers].filter(([, a]) => a.a === k).map(([p]) => p);

// ====================================================================== GAME 4: reaction
function createReact(ps) {
  const ROUNDS = 6;
  const sc = new Map(ps.map(p => [p, { pts: 0, best: null }]));
  let round = 0, phase = 'wait', t = 0, goAt = rand(1.8, 4.5), winner = null, early = new Set(), times = new Map();
  const eligible = () => [...sc.keys()].filter(p => p.connected && !early.has(p));
  function newRound() { phase = 'wait'; t = 0; goAt = rand(1.8, 4.5); winner = null; early = new Set(); times = new Map(); }
  const g = {
    uiFor: p => sc.has(p) ? { ui: 'tap' } : null,
    input(p) {
      if (!sc.has(p)) return;
      if (phase === 'wait') { if (!early.has(p)) { early.add(p); send(p, { t: 'buzz', ms: 300 }); } return; }
      if (phase !== 'go' || early.has(p) || times.has(p)) return;
      const ms = Math.round(t * 1000); times.set(p, ms);
      const s = sc.get(p); if (s.best === null || ms < s.best) s.best = ms;
      if (!winner) { winner = p; s.pts++; send(p, { t: 'buzz', ms: [60, 40, 60] }); }
      if (eligible().every(q => times.has(q))) { phase = 'res'; t = 0; }
    },
    update(dt) {
      t += dt;
      if (phase === 'wait' && t >= goAt) { phase = 'go'; t = 0; }
      else if (phase === 'go' && t > 2.5) { phase = 'res'; t = 0; }
      else if (phase === 'res' && t > 2.8) {
        round++;
        if (round >= ROUNDS) g.result = [...sc].sort((a, b) => b[1].pts - a[1].pts || (a[1].best ?? 1e9) - (b[1].best ?? 1e9))
          .map(([p, s]) => ({ p, label: `${s.pts} ניצחונות · שיא ${s.best === null ? '–' : s.best + 'ms'}` }));
        else newRound();
      }
    },
    draw() {
      if (phase === 'wait') {
        bg('#5c0f1a', '#8a1426');
        T('חכו לירוק…', W / 2, H / 2 - 40, 150);
        T('מי שלוחץ מוקדם – נפסל בסיבוב', W / 2, H / 2 + 100, 44, 'rgba(255,255,255,.7)');
      } else if (phase === 'go') {
        bg('#1b8a3a', '#2fbf5a');
        T('עכשיו! 👆', W / 2, H / 2 - 20, 220);
      } else {
        bg('#13203d', '#1f3460');
        T(winner ? `⚡ ${winner.name} הכי מהיר/ה!` : 'אף אחד לא לחץ 😴', W / 2, 220, 100, winner ? winner.color : '#fff');
        const rows = [...sc.keys()].map(p => ({ p, ms: times.get(p), early: early.has(p) }))
          .sort((a, b) => (a.ms ?? 1e9) - (b.ms ?? 1e9));
        rows.slice(0, 8).forEach((r, k) => T(`${r.p.name}: ${r.early ? 'מוקדם מדי! 🚫' : r.ms != null ? r.ms + 'ms' : '—'}`, W / 2, 360 + k * 70, 46, r.p.color));
      }
      T(`סיבוב ${Math.min(round + 1, ROUNDS)} מתוך ${ROUNDS}`, W / 2, 60, 34, 'rgba(255,255,255,.75)');
      chips([...sc].map(([p, s]) => ({ p, text: '⚡' + s.pts, dim: early.has(p) && phase !== 'res' })), H - 50);
    },
  };
  return g;
}

// ====================================================================== GAME 5: sumo
function createSumo(ps) {
  const C = { x: W / 2, y: H / 2 + 40 }, R0 = 430, RB = 46;
  let R = R0;
  const list = ps.map(p => ({ p }));
  const solo = list.length === 1;
  if (solo) list.push({ p: makeBot('בוט 1') }, { p: makeBot('בוט 2') });
  const humans = list.filter(c => !c.p.bot);
  const wins = new Map(humans.map(c => [c, 0]));
  const NEED = 2, MAXR = solo ? 3 : 5;
  let round = 1, phase = 'play', t = 0, roundWinner = null;
  function reset() {
    R = R0; phase = 'play'; t = 0; roundWinner = null;
    list.forEach((c, i) => { const a = i / list.length * Math.PI * 2 - Math.PI / 2; Object.assign(c, { x: C.x + Math.cos(a) * R * 0.62, y: C.y + Math.sin(a) * R * 0.62, vx: 0, vy: 0, ix: 0, iy: 0, alive: true, fall: 0, dashCd: 0 }); });
  }
  reset();
  function bot(c, dt) {
    c.botAcc = (c.botAcc || 0) + dt * (5 + Math.random() * 2);   // ~6 taps per second
    while (c.botAcc >= 1) { c.botAcc -= 1; push(c); }
  }
  // every tap shoves your sumo toward the nearest opponent – tap faster, push harder
  function push(c) {
    if (!c.alive || phase !== 'play') return;
    const others = list.filter(o => o !== c && o.alive);
    let dx = C.x - c.x, dy = C.y - c.y;
    if (others.length) { const o = others.reduce((a, b) => Math.hypot(a.x - c.x, a.y - c.y) < Math.hypot(b.x - c.x, b.y - c.y) ? a : b); dx = o.x - c.x; dy = o.y - c.y; }
    const l = Math.hypot(dx, dy) || 1;
    c.vx += dx / l * 150; c.vy += dy / l * 150;
    c.pulse = 0.15; c.taps = (c.taps || 0) + 1;
  }
  function dash(c) {
    let dx = c.ix, dy = c.iy, l = Math.hypot(dx, dy);
    if (l < 0.2) { dx = c.vx; dy = c.vy; l = Math.hypot(dx, dy); }
    if (l < 0.01) return;
    c.vx += dx / l * 760; c.vy += dy / l * 760; c.dashCd = 1.6;
  }
  function endRound(w) {
    phase = 'between'; t = 0; roundWinner = w;
    if (w && wins.has(w)) wins.set(w, wins.get(w) + 1);
  }
  const g = {
    uiFor: p => list.some(c => c.p === p) ? { ui: 'tap', label: 'דחוף! 👊', hint: 'לחצו כמה שיותר מהר – כל לחיצה דוחפת את הסומו שלכם לעבר היריב!' } : null,
    input(p, m) {
      const c = list.find(c => c.p === p); if (!c) return;
      if (m.tap) push(c);
    },
    update(dt) {
      t += dt;
      for (const c of list) if (!c.alive && c.fall > 0) c.fall = Math.max(0, c.fall - dt * 1.8);
      if (phase === 'between') {
        if (t > 2.8) {
          const best = Math.max(...wins.values());
          if ((!solo && best >= NEED) || round >= MAXR) {
            g.result = [...wins].sort((a, b) => b[1] - a[1]).map(([c, w]) => ({ p: c.p, label: `${w} ${w === 1 ? 'סיבוב' : 'סיבובים'}${solo ? ` מתוך ${MAXR}` : ''}` }));
          } else { round++; reset(); }
        }
        return;
      }
      if (t > 14) R = Math.max(230, R - dt * 14);
      for (const c of list) {
        if (!c.alive) continue;
        if (c.p.bot) bot(c, dt);
        if (c.pulse > 0) c.pulse -= dt;
        const damp = Math.exp(-1.7 * dt); c.vx *= damp; c.vy *= damp;
        const sp = Math.hypot(c.vx, c.vy); if (sp > 1150) { c.vx *= 1150 / sp; c.vy *= 1150 / sp; }
        c.x += c.vx * dt; c.y += c.vy * dt;
      }
      const al = list.filter(c => c.alive);
      for (let a = 0; a < al.length; a++) for (let b = a + 1; b < al.length; b++) {
        const A = al[a], B = al[b]; const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy);
        if (d > 0 && d < RB * 2) {
          const nx = dx / d, ny = dy / d, ov = RB * 2 - d;
          A.x -= nx * ov / 2; A.y -= ny * ov / 2; B.x += nx * ov / 2; B.y += ny * ov / 2;
          const rv = (B.vx - A.vx) * nx + (B.vy - A.vy) * ny;
          if (rv < 0) {
            const j = -(1 + 1.3) * rv / 2;
            A.vx -= j * nx; A.vy -= j * ny; B.vx += j * nx; B.vy += j * ny;
            if (-rv > 250) { send(A.p, { t: 'buzz', ms: 40 }); send(B.p, { t: 'buzz', ms: 40 }); }
          }
        }
      }
      for (const c of al) if (Math.hypot(c.x - C.x, c.y - C.y) > R) { c.alive = false; c.fall = 1; send(c.p, { t: 'buzz', ms: 300 }); }
      const still = list.filter(c => c.alive);
      if (solo) {
        if (!humans[0].alive) endRound(null);
        else if (still.length === 1) endRound(humans[0]);
      } else if (still.length <= 1) endRound(still[0] || null);
    },
    draw() {
      bg('#1a0f0a', '#3a2214');
      const grd = ctx.createRadialGradient(C.x, C.y, 40, C.x, C.y, R);
      grd.addColorStop(0, '#f1d9a8'); grd.addColorStop(1, '#c99a5b');
      ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(C.x, C.y, R, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 14; ctx.strokeStyle = '#fff3'; ctx.stroke();
      ctx.lineWidth = 8; ctx.strokeStyle = R < R0 ? '#ff6b6b' : '#8a5a2b'; ctx.beginPath(); ctx.arc(C.x, C.y, R, 0, Math.PI * 2); ctx.stroke();
      for (const c of list) {
        if (!c.alive && c.fall <= 0) continue;
        const s = c.alive ? 1 : c.fall;
        ctx.globalAlpha = c.alive ? 1 : c.fall;
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(c.x, c.y + RB * 0.75 * s, RB * s, RB * 0.35 * s, 0, 0, Math.PI * 2); ctx.fill();
        const gg = ctx.createRadialGradient(c.x - 14 * s, c.y - 16 * s, 4, c.x, c.y, RB * s);
        gg.addColorStop(0, '#fff'); gg.addColorStop(0.25, c.p.color); gg.addColorStop(1, c.p.color);
        ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(c.x, c.y, RB * s, 0, Math.PI * 2); ctx.fill();
        if (c.alive && c.pulse > 0) { ctx.lineWidth = 8; ctx.strokeStyle = '#fff'; ctx.stroke(); }
        T(c.p.name, c.x, c.y - RB - 24, 28, '#fff');
        ctx.globalAlpha = 1;
      }
      T(`סיבוב ${round}${solo ? ` מתוך ${MAXR}` : ''}`, W / 2, 50, 36, 'rgba(255,255,255,.8)');
      chips([...wins].map(([c, w]) => ({ p: c.p, text: '🏆' + w, dim: !c.alive })), H - 45);
      if (phase === 'between') {
        ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H);
        T(roundWinner ? `💥 ${roundWinner.p.name} ניצח/ה בסיבוב!` : (solo ? 'נפלת! 😵' : 'תיקו!'), W / 2, H / 2, 110, roundWinner ? roundWinner.p.color : '#fff');
      }
    },
  };
  return g;
}

// ====================================================================== GAME 6: battleships
function createShips(ps) {
  const N = 10, SH = [5, 4, 3, 3, 2];
  const sides = ps.slice(0, 2).map(p => ({ p }));
  if (sides.length === 1) sides.push({ p: makeBot('המחשב') });
  function board() {
    const cells = new Int8Array(N * N).fill(-1), ships = [];
    SH.forEach((len, id) => {
      for (let tries = 0; tries < 1000; tries++) {
        const h = Math.random() < 0.5;
        const x = Math.floor(Math.random() * (h ? N - len + 1 : N)), y = Math.floor(Math.random() * (h ? N : N - len + 1));
        const idx = []; for (let k = 0; k < len; k++) idx.push((y + (h ? 0 : k)) * N + x + (h ? k : 0));
        if (idx.every(i => cells[i] < 0)) { idx.forEach(i => cells[i] = id); ships.push({ len, idx, hits: 0, sunk: false }); break; }
      }
    });
    return { cells, ships };
  }
  sides.forEach(s => { Object.assign(s, board()); s.shots = new Uint8Array(N * N); s.ready = !!s.p.bot; });
  let phase = 'setup', turn = Math.floor(Math.random() * 2), t = 0, last = null, msg = null, passTurn = false, cpuT = 0;
  const other = i => 1 - i;
  const sideOf = p => sides.findIndex(s => s.p === p);
  const hitsOn = s => s.shots.reduce((a, v) => a + (v === 2), 0);
  function view(s, showShips) {
    let out = '';
    for (let i = 0; i < N * N; i++) {
      const sh = s.cells[i], shot = s.shots[i];
      out += sh >= 0 && s.ships[sh].sunk ? 'k' : shot === 2 ? 'x' : shot === 1 ? 'o' : showShips && sh >= 0 ? 's' : '.';
    }
    return out;
  }
  function shoot(i, cell) {
    const me = sides[i], op = sides[other(i)];
    if (cell < 0 || cell >= N * N || op.shots[cell]) return;
    const sh = op.cells[cell];
    if (sh >= 0) {
      op.shots[cell] = 2;
      const ship = op.ships[sh]; ship.hits++;
      if (ship.hits >= ship.len) { ship.sunk = true; msg = { text: `💥 הוטבעה ספינה באורך ${ship.len}!`, c: '#ff6b6b' }; send(me.p, { t: 'buzz', ms: [80, 50, 80, 50, 150] }); send(op.p, { t: 'buzz', ms: 400 }); }
      else { msg = { text: '🔥 פגיעה! יורים שוב', c: '#ffa94d' }; send(me.p, { t: 'buzz', ms: 80 }); send(op.p, { t: 'buzz', ms: 150 }); }
      Music.sfx('boom', 0.6);
      passTurn = false;
      if (op.ships.every(s => s.sunk)) {
        const win = { p: me.p, label: `ניצחון! ${hitsOn(op)} פגיעות` }, lose = { p: op.p, label: `${hitsOn(me)} פגיעות` };
        g.result = [win, lose].filter(r => !r.p.bot);
        if (me.p.bot) g.result.unshift({ p: { name: 'המחשב', color: '#adb5bd', bot: true }, label: 'ניצחון' });
      }
    } else {
      op.shots[cell] = 1; msg = { text: '💧 החטאה', c: '#74c0fc' }; passTurn = true;

// ====================================================================== GAME 7: checkers
function createCheckers(ps) {
  const N = 8;
  const sides = ps.slice(0, 2).map(p => ({ p }));
  if (sides.length === 1) sides.push({ p: makeBot('המחשב') });
  const COL = ['#e03131', '#212529'];   // side 0 red (bottom, moves up), side 1 black (top, moves down)
  const B = new Array(N * N).fill(null);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if ((r + c) % 2 === 1) {
    if (r < 3) B[r * N + c] = { s: 1, k: false };
    else if (r > 4) B[r * N + c] = { s: 0, k: false };
  }
  let turn = 0, sel = null, chain = null, last = null, moves = 0, cpuT = 0, msg = null, msgT = 0;
  const sideOf = p => sides.findIndex(s => s.p === p);
  const count = s => B.filter(x => x && x.s === s).length;

  function pieceMoves(i, capsOnly) {
    const pc = B[i]; if (!pc) return [];
    const r = (i / N) | 0, c = i % N, out = [];
    const dirs = pc.k ? [-1, 1] : [pc.s === 0 ? -1 : 1];
    for (const dr of dirs) for (const dc of [-1, 1]) {
      const r1 = r + dr, c1 = c + dc, r2 = r + 2 * dr, c2 = c + 2 * dc;
      if (r1 < 0 || r1 >= N || c1 < 0 || c1 >= N) continue;
      const mid = B[r1 * N + c1];
      if (!mid) { if (!capsOnly) out.push({ from: i, to: r1 * N + c1, cap: -1 }); }
      else if (mid.s !== pc.s && r2 >= 0 && r2 < N && c2 >= 0 && c2 < N && !B[r2 * N + c2]) out.push({ from: i, to: r2 * N + c2, cap: r1 * N + c1 });
    }
    return out;
  }
  function legal(side) {
    if (chain != null) return pieceMoves(chain, true);
    let all = [];
    for (let i = 0; i < N * N; i++) if (B[i] && B[i].s === side) all = all.concat(pieceMoves(i, false));
    const caps = all.filter(m => m.cap >= 0);
    return caps.length ? caps : all;   // capturing is mandatory
  }
  function doMove(mv) {
    const pc = B[mv.from]; B[mv.to] = pc; B[mv.from] = null;
    last = mv; moves++;
    let promoted = false;
    const row = (mv.to / N) | 0;
    if (!pc.k && ((pc.s === 0 && row === 0) || (pc.s === 1 && row === N - 1))) { pc.k = true; promoted = true; msg = '👑 מלך!'; msgT = 1.2; }
    if (mv.cap >= 0) {
      B[mv.cap] = null; Music.sfx('hit');
      send(sides[1 - pc.s].p, { t: 'buzz', ms: 150 });
      if (!promoted && pieceMoves(mv.to, true).length) { chain = mv.to; sel = mv.to; syncControllers(); return; }
    } else Music.sfx('click');
    chain = null; sel = null; turn = 1 - turn;
    const opp = turn;
    if (!count(opp) || !legal(opp).length || moves >= 200) {
      let w;
      if (moves >= 200 && count(opp) && legal(opp).length) w = count(0) === count(1) ? -1 : count(0) > count(1) ? 0 : 1;
      else w = 1 - opp;
      const rs = [0, 1].map(s => ({ s, p: sides[s].p, label: `${count(s)} כלים נשארו` }));
      if (w >= 0) { rs.sort((a, b) => (a.s === w ? -1 : 1)); rs[0].label = 'ניצחון! · ' + rs[0].label; }
      g.result = rs.filter(r => !r.p.bot).map(r => ({ p: r.p, label: r.label }));
      if (w >= 0 && sides[w].p.bot) g.result.unshift({ p: { name: 'המחשב', color: '#adb5bd', bot: true }, label: 'ניצחון' });
      return;
    }
    syncControllers();
  }
  function cells() { let s = ''; for (let i = 0; i < N * N; i++) { const r = (i / N) | 0, c = i % N, pc = B[i]; s += pc ? (pc.s === 0 ? (pc.k ? 'R' : 'r') : (pc.k ? 'B' : 'b')) : ((r + c) % 2 ? 'd' : 'l'); } return s; }
  function highlights(side) {

    if (sel != null) return { hl: L.filter(m => m.from === sel).map(m => m.to), sel };
    return { hl: [...new Set(L.map(m => m.from))], sel: -1 };
  }
  function cpuMove() {
    const L = legal(turn);

      B[mv.to] = B[mv.from]; B[mv.from] = null; if (mv.cap >= 0) B[mv.cap] = null;

      B[mv.from] = save[0]; B[mv.to] = save[1]; if (mv.cap >= 0) B[mv.cap] = save[2];
      return !danger;
    };
    const score = mv => (mv.cap >= 0 ? 5 : 0) + (safe(mv) ? 3 : 0) + (!B[mv.from].k && (((mv.to / N) | 0) === (turn === 0 ? 0 : N - 1)) ? 4 : 0) + Math.random() * 2;
    return L.sort((a, b) => score(b) - score(a))[0];
  }
  const g = {
    uiFor(p) {
      const i = sideOf(p); if (i < 0) return null;

    },
    input(p, m) {
      const i = sideOf(p); if (i !== turn || typeof m.cell !== 'number') return;
      const cell = m.cell | 0, L = legal(i);
      if (sel != null) {

      else if (chain == null) sel = null;

    },
    update(dt) {
      if (msgT > 0) msgT -= dt;

    },
    draw() {

      const h = highlights(turn);
      for (let i = 0; i < N * N; i++) {
        const r = (i / N) | 0, c = i % N, x = BX + c * CSZ, y = BY + r * CSZ;
        ctx.fillStyle = (r + c) % 2 ? '#7a4a24' : '#e8cfa0'; ctx.fillRect(x, y, CSZ, CSZ);
        if (last && (i === last.from || i === last.to)) { ctx.fillStyle = 'rgba(255,212,59,.28)'; ctx.fillRect(x, y, CSZ, CSZ); }
        if (h.hl.includes(i) && h.sel >= 0) { ctx.fillStyle = 'rgba(81,207,102,.55)'; ctx.beginPath(); ctx.arc(x + CSZ / 2, y + CSZ / 2, 18, 0, Math.PI * 2); ctx.fill(); }

      }

        const on = turn === s;
        rrect(x - 190, H / 2 - 200, 380, 400, 30); ctx.fillStyle = on ? 'rgba(255,212,59,.22)' : 'rgba(255,255,255,.07)'; ctx.fill();
        ctx.fillStyle = COL[s]; ctx.beginPath(); ctx.arc(x, H / 2 - 110, 46, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff6'; ctx.lineWidth = 4; ctx.stroke();

      });

    { id: 'wind', icon: '💨', name: 'רוח חזקה', info: 'הבלוקים של כולם זזים מהר!' },
    { id: 'fog', icon: '🌫️', name: 'ערפל', info: 'ערפל על המגדלים של כולם!' },
    { id: 'quake', icon: '🌋', name: 'רעידת אדמה', info: 'כל היריבים מאבדים קומה!' },
    { id: 'wide', icon: '🧱', name: 'בלוק ענק', info: 'הבלוק הבא שלך ענק!' },
  ];
  const ROUND = 100;
  let t = 0, ended = false;
  const debris = [], floaters = [];
  list.forEach((c, i) => Object.assign(c, {
    i, cx: LW * i + LW / 2, floors: [], lives: 3, done: false, combo: 0, power: null, cam: 0,
    mover: null, drop: null, wait: 0.6, wind: 0, fog: 0, wideNext: false, flashT: 0, banner: null,
    botErr: rand(4, 16), botPow: 0,
  }));
  const top = c => c.floors.length ? c.floors[c.floors.length - 1] : { x: 0, w: B0 + 40 };
  const topY = c => BASEY - c.floors.length * BH;   // y of the tower's top surface
  const speed = c => Math.min(760, 230 + c.floors.length * 14) * (c.wind > 0 ? 1.75 : 1);
  function spawn(c) {
    const w = c.wideNext ? B0 : (c.floors.length ? top(c).w : B0);
    c.wideNext = false;
    const dir = Math.random() < 0.5 ? -1 : 1;
    c.mover = { x: -dir * (LW / 2 - w / 2 - 6), w, dir };
    c.botErr = rand(-1, 1) * rand(4, 30); c.botWait = rand(0.5, 1.8);
  }
  function others(c) { return list.filter(o => o !== c && !o.done); }
  function say(c, text, color = '#fff') { c.banner = { text, t: 1.6, color }; }
  function sync(c) { if (!c.p.bot) sendUI(c.p, g.uiFor(c.p)); }
  function drop(c) {
    if (!c.mover || c.done || ended) return;
    const m = c.mover; c.mover = null;
    c.drop = { x: m.x, w: m.w, y: topY(c) - BH * 3.2, vy: 0 };
    Music.sfx('click');
  }
  function land(c) {
    const d = c.drop; c.drop = null;
    const tp = top(c), l = Math.max(d.x - d.w / 2, tp.x - tp.w / 2), r = Math.min(d.x + d.w / 2, tp.x + tp.w / 2), ov = r - l;
    const y = topY(c) - BH;
    if (ov <= 4) {   // missed completely
      debris.push({ x: c.cx + d.x, y, w: d.w, h: BH, vx: (d.x - tp.x) * 2, vy: -100, rot: 0, vr: Math.sign(d.x - tp.x || 1) * 3, color: c.p.color, t: 0 });
      c.lives--; c.combo = 0; c.flashT = 0.4;

      send(c.p, { t: 'buzz', ms: 250 }); Music.sfx('boom', 0.5);
      if (c.lives <= 0) { c.done = true; sync(c); } else c.wait = 0.5;
      return;
    }
    let nx, nw;
    if (Math.abs(d.x - tp.x) < 7 && c.floors.length) {   // perfect!
      nx = tp.x; nw = Math.min(B0, tp.w + (c.combo >= 2 ? 14 : 0)); c.combo++;
      floaters.push({ x: c.cx + nx, y: y - 10, text: c.combo >= 3 ? `מושלם ×${c.combo}!` : 'מושלם!', t: 0, color: '#ffe066' });
      Music.sfx('hit');
    } else {
      nx = (l + r) / 2; nw = c.floors.length ? ov : d.w; c.combo = 0;
      if (c.floors.length) {   // the overhang breaks off
        const cutL = d.x - d.w / 2 < l, cw = d.w - ov;
        if (cw > 1) debris.push({ x: c.cx + (cutL ? l - cw / 2 : r + cw / 2), y, w: cw, h: BH, vx: cutL ? -80 : 80, vy: -60, rot: 0, vr: cutL ? -2.5 : 2.5, color: c.p.color, t: 0 });
      } else nx = d.x;
      Music.sfx('thump');
    }
    c.floors.push({ x: nx, w: nw, hue: c.floors.length });
    send(c.p, { t: 'buzz', ms: 20 });
    if (c.floors.length % 5 === 0 && !c.power) {
      c.power = POWERS[Math.floor(Math.random() * POWERS.length)];
      say(c, `🎁 בונוס: ${c.power.icon} ${c.power.name}`, '#ffe066'); sync(c);
    }
    c.wait = 0.25;
  }
  function usePower(c) {
    const pw = c.power; if (!pw || c.done || ended) return;
    c.power = null; sync(c);
    say(c, `${pw.icon} ${pw.name}!`, '#ffe066');
    const foes = others(c);
    if (pw.id === 'wind') foes.forEach(o => { o.wind = 7; say(o, '💨 רוח חזקה!', '#a5d8ff'); });
    else if (pw.id === 'fog') foes.forEach(o => { o.fog = 6; say(o, '🌫️ ערפל!', '#dee2e6'); });
    else if (pw.id === 'quake') foes.forEach(o => {
      if (o.floors.length > 1) { const f = o.floors.pop(); debris.push({ x: o.cx + f.x, y: topY(o) - BH, w: f.w, h: BH, vx: rand(-200, 200), vy: -300, rot: 0, vr: rand(-4, 4), color: o.p.color, t: 0 }); }
      o.shake = 0.6; say(o, '🌋 רעידת אדמה!', '#ffa94d'); send(o.p, { t: 'buzz', ms: [80, 40, 80] });
    });
    else if (pw.id === 'wide') { c.wideNext = true; if (c.mover) { c.mover.w = B0; c.mover.x = clamp(c.mover.x, -(LW / 2 - B0 / 2 - 6), LW / 2 - B0 / 2 - 6); } }
    Music.sfx('whoosh');
  }
  function finish() {
    ended = true;
    g.result = list.slice().sort((a, b) => b.floors.length - a.floors.length || b.lives - a.lives)
      .map(c => ({ p: c.p, label: `${c.floors.length} קומות` }));
  }
  function bot(c, dt) {
    if (c.power) { c.botPow += dt; if (c.botPow > 1.5) { c.botPow = 0; usePower(c); } }
    const m = c.mover; if (!m) return;
    if ((c.botWait -= dt) > 0) return;

  }

  const g = {
    dbgT: () => list[0],
    uiFor(p) {
      const c = list.find(c => c.p === p); if (!c) return null;
      if (c.done) return { ui: 'wait', text: `המגדל שלך: ${c.floors.length} קומות 🏗️ · מחכים לשאר…` };
      return { ui: 'tap', label: 'הפל! ⬇️', hint: 'לחצו כשהבלוק בדיוק מעל המגדל · כל 5 קומות = בונוס',
        extra: c.power ? { id: 'power', label: `${c.power.icon} ${c.power.name}` } : { id: 'power', label: '🎁 בונוס כל 5 קומות', disabled: true } };
    },
    input(p, m) {
      const c = list.find(c => c.p === p); if (!c) return;
      if (m.tap) drop(c);
      if (m.btn === 'power') usePower(c);
    },
    update(dt) {
      if (ended) return;
      t += dt;
      for (const c of list) {
        c.wind = Math.max(0, c.wind - dt); c.fog = Math.max(0, c.fog - dt); c.flashT = Math.max(0, c.flashT - dt);
        c.shake = Math.max(0, (c.shake || 0) - dt);
        if (c.banner) { c.banner.t -= dt; if (c.banner.t <= 0) c.banner = null; }
        c.cam += (Math.max(0, c.floors.length - 9) * BH - c.cam) * Math.min(1, dt * 4);
        if (c.done) continue;
        if (c.mover) {
          const m = c.mover, lim = LW / 2 - m.w / 2 - 6;
          m.x += m.dir * speed(c) * dt;
          if (m.x > lim) { m.x = lim; m.dir = -1; } else if (m.x < -lim) { m.x = -lim; m.dir = 1; }
        } else if (c.drop) {
          const d = c.drop; d.vy += GRAV * dt; d.y += d.vy * dt;
          if (d.y >= topY(c) - BH) land(c);
        } else { c.wait -= dt; if (c.wait <= 0) spawn(c); }
        if (c.p.bot) bot(c, dt);
      }
      for (const d of debris) { d.t += dt; d.vy += GRAV * 0.6 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt; }
      for (let i = debris.length - 1; i >= 0; i--) if (debris[i].t > 3) debris.splice(i, 1);
      for (const f of floaters) { f.t += dt; f.y -= 50 * dt; }
      for (let i = floaters.length - 1; i >= 0; i--) if (floaters[i].t > 1.2) floaters.splice(i, 1);
      if (t >= ROUND || list.every(c => c.done)) finish();
    },
    draw() {
      for (const c of list) {
        const x0 = LW * c.i, alt = Math.min(1, c.cam / (BH * 40));
        ctx.save();
        ctx.beginPath(); ctx.rect(x0, 0, LW, H); ctx.clip();
        if (c.shake > 0) ctx.translate(rand(-8, 8) * c.shake, rand(-5, 5) * c.shake);
        // sky gets darker (and starry) the higher the tower climbs
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        const mix = (a, b) => a.map((v, k) => Math.round(v + (b[k] - v) * alt));
        const s1 = mix([110, 200, 255], [20, 24, 70]), s2 = mix([255, 228, 190], [80, 70, 150]);
        sky.addColorStop(0, `rgb(${s1})`); sky.addColorStop(1, `rgb(${s2})`);
        ctx.fillStyle = sky; ctx.fillRect(x0, 0, LW, H);
        if (alt > 0.3) { ctx.fillStyle = `rgba(255,255,255,${(alt - 0.3) * 1.2})`; for (let k = 0; k < 14; k++) { const sx = x0 + ((k * 137 + c.i * 59) % LW), sy = ((k * 211) % 700) + 40; ctx.fillRect(sx, sy, 3, 3); } }
        // drifting clouds that slide down as the camera climbs
        ctx.fillStyle = 'rgba(255,255,255,.75)';
        for (let k = 0; k < 4; k++) {
          const cy = ((k * 290 + c.cam * 0.5) % (H + 200)) - 100, cx = x0 + ((k * 173 + t * 12 * (k % 2 ? 1 : -1)) % (LW + 160) + LW + 160) % (LW + 160) - 80;
          ctx.beginPath(); ctx.arc(cx, cy, 30, 0, 7); ctx.arc(cx + 32, cy - 10, 24, 0, 7); ctx.arc(cx + 58, cy, 20, 0, 7); ctx.fill();
        }
        ctx.translate(0, c.cam);
        // ground hill
        ctx.fillStyle = '#e0b872'; ctx.beginPath(); ctx.ellipse(c.cx, BASEY + 120, LW * 0.75, 140, 0, Math.PI, 0); ctx.fill();
        ctx.fillStyle = '#c9974f'; ctx.fillRect(x0, BASEY + 40, LW, 200);
        rrect(c.cx - (B0 + 40) / 2, BASEY, B0 + 40, 26, 6); ctx.fillStyle = '#8d6e48'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#4a3420'; ctx.stroke();
        // floors
        c.floors.forEach((f, k) => drawBrick(c.cx + f.x, BASEY - (k + 1) * BH, f.w, BH, c.p.color, k));
        if (c.fog > 0) {
          const fy = topY(c) - BH * 4;
          const fg = ctx.createLinearGradient(0, fy, 0, fy + BH * 8); fg.addColorStop(0, 'rgba(230,234,240,0)'); fg.addColorStop(0.3, 'rgba(230,234,240,.97)'); fg.addColorStop(1, 'rgba(230,234,240,.97)');
          ctx.fillStyle = fg; ctx.fillRect(x0, fy, LW, BH * 8);
        }
        if (c.drop) drawBrick(c.cx + c.drop.x, c.drop.y, c.drop.w, BH, c.p.color, c.floors.length);
        if (c.mover) {
          const m = c.mover, my = topY(c) - BH * 3.2;
          ctx.strokeStyle = 'rgba(60,40,20,.55)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(c.cx + m.x, my - 400); ctx.lineTo(c.cx + m.x, my); ctx.stroke();
          drawBrick(c.cx + m.x, my, m.w, BH, c.p.color, c.floors.length);
          ctx.setLineDash([6, 8]); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(c.cx + m.x - m.w / 2, my + BH); ctx.lineTo(c.cx + m.x - m.w / 2, topY(c)); ctx.moveTo(c.cx + m.x + m.w / 2, my + BH); ctx.lineTo(c.cx + m.x + m.w / 2, topY(c)); ctx.stroke(); ctx.setLineDash([]);
        }
        ctx.restore();
        if (c.flashT > 0) { ctx.fillStyle = `rgba(255,60,60,${c.flashT * 0.6})`; ctx.fillRect(x0, 0, LW, H); }
        if (c.done) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x0, 0, LW, H); }
        // lane HUD
        const fs = Math.min(34, LW / 7);
        rrect(x0 + 8, H - 92, LW - 16, 82, 20); ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fill();
        ctx.fillStyle = c.p.color; ctx.fillRect(x0 + 8, H - 92, LW - 16, 6);
        T(c.p.name, c.cx, H - 66, fs, '#fff');
        T(`🏗️ ${c.floors.length}   ${'❤️'.repeat(Math.max(0, c.lives))}${c.power ? '   ' + c.power.icon : ''}`, c.cx, H - 30, fs * 0.85, '#fff');
        if (c.banner) { ctx.globalAlpha = Math.min(1, c.banner.t * 2); T(c.banner.text, c.cx, 200, Math.min(44, LW / 9), c.banner.color); ctx.globalAlpha = 1; }
        if (c.i > 0) { ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(x0 - 2, 0, 4, H); }
      }
      for (const d of debris) {
        const c = list.find(c => d.x >= LW * c.i && d.x < LW * (c.i + 1)) || list[0];
        ctx.save(); ctx.translate(d.x, d.y + c.cam + BH / 2); ctx.rotate(d.rot); drawBrick(0, -BH / 2, d.w, d.h, d.color, 0); ctx.restore();
      }
      for (const f of floaters) { const c = list.find(c => f.x >= LW * c.i && f.x < LW * (c.i + 1)) || list[0]; ctx.globalAlpha = 1 - f.t / 1.2; T(f.text, f.x, f.y + c.cam, 34, f.color); ctx.globalAlpha = 1; }
      const left = Math.max(0, Math.ceil(ROUND - t));
      rrect(W / 2 - 110, 14, 220, 64, 32); ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fill();
      T(`⏱ ${left}`, W / 2, 47, 40, left <= 10 ? '#ff8787' : '#fff');
    },
  };
  // a cartoony stone brick in the player's colour, with an arched window every other floor
  function drawBrick(cx, y, w, h, col, k) {
    const x = cx - w / 2;
    rrect(x, y, w, h, 7); ctx.fillStyle = col; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x, y, w, 7);
    ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(x, y + h - 7, w, 7);
    ctx.fillStyle = 'rgba(0,0,0,.13)';
    const off = k % 2 ? 0 : 22;
    for (let bx = x + off; bx < x + w; bx += 44) ctx.fillRect(bx, y + 4, 3, h - 8);
    if (k % 2 === 0 && w > 50) {
      ctx.fillStyle = 'rgba(40,25,10,.55)';
      ctx.beginPath(); ctx.moveTo(cx - 9, y + h - 8); ctx.lineTo(cx - 9, y + h * 0.45); ctx.arc(cx, y + h * 0.45, 9, Math.PI, 0); ctx.lineTo(cx + 9, y + h - 8); ctx.fill();
    }
    ctx.restore();
    rrect(x, y, w, h, 7); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(40,25,10,.8)'; ctx.stroke();
  }
  return g;
}

// ====================================================================== GAME 10: racing (top-down, 3 laps, turbo & boost pads)
function createRace(ps) {
  const TRACKS = [
    { name: 'מסלול הגבעות', pts: [[300, 260], [960, 200], [1620, 260], [1760, 560], [1600, 880], [1200, 880], [960, 660], [720, 880], [320, 880], [160, 560]] },
    { name: 'מסלול הנחש', pts: [[300, 270], [760, 230], [960, 440], [1180, 230], [1640, 270], [1760, 560], [1600, 880], [1200, 860], [960, 700], [720, 860], [320, 880], [170, 560]] },
    { name: 'מסלול הטבעת', pts: [[420, 230], [960, 200], [1500, 230], [1760, 540], [1500, 860], [960, 890], [420, 860], [160, 540]] },
  ];
  const TR = TRACKS[Math.floor(Math.random() * TRACKS.length)];
  // smooth closed centre line (Catmull-Rom)
  const P = TR.pts, C = [];
  for (let i = 0; i < P.length; i++) {
    const p0 = P[(i - 1 + P.length) % P.length], p1 = P[i], p2 = P[(i + 1) % P.length], p3 = P[(i + 2) % P.length];
    for (let s = 0; s < 40; s++) {
      const u = s / 40, u2 = u * u, u3 = u2 * u;
      C.push([0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3),
              0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3)]);
    }
  }
  const NC = C.length, TW2 = 88, LAPS = 5, R = 20;
  const dirAt = i => { const a = C[(i + 1) % NC], b = C[(i - 1 + NC) % NC]; return Math.atan2(a[1] - b[1], a[0] - b[0]); };
  const pads = [Math.floor(NC * 0.22), Math.floor(NC * 0.55), Math.floor(NC * 0.8)].map(i => ({ i, x: C[i][0], y: C[i][1], a: dirAt(i) }));
  const BOTC = ['#f59f00', '#7950f2', '#12b886', '#e64980', '#868e96'];
  const list = ps.map(p => ({ p }));
  let nb = 0; while (list.length < 4) { list.push({ p: Object.assign(makeBot('בוט ' + (nb + 1)), { color: BOTC[nb] }) }); nb++; }
  // starting grid behind the line, two columns
  const a0 = dirAt(0);
  list.forEach((c, k) => {
    const row = Math.floor(k / 2), col = k % 2 ? 1 : -1, back = 60 + row * 70;
    const bx = C[0][0] - Math.cos(a0) * back, by = C[0][1] - Math.sin(a0) * back;
    Object.assign(c, { x: bx + Math.cos(a0 + Math.PI / 2) * col * 38, y: by + Math.sin(a0 + Math.PI / 2) * col * 38, ang: a0, vx: 0, vy: 0, steer: 0, idx: NC - 1 - Math.floor(back / 10), lap: -1, done: false, time: 0,
      turbo: 3, turboT: 0, padT: 0, offT: 0, botOff: rand(-40, 40), botSkill: rand(0.86, 0.95), botTurboT: rand(4, 9), place: k + 1 });
  });
  let t = 0, firstDone = null, ended = false, banner = { text: `🏁 ${TR.name} · ${LAPS} הקפות`, t: 2.2 };
  // nearest centre-line sample, searched around the last one so laps can't be skipped
  function track(c) {
    let best = c.idx, bd = Infinity;
    for (let k = -30; k <= 30; k++) { const i = (c.idx + k + NC) % NC, d = (C[i][0] - c.x) ** 2 + (C[i][1] - c.y) ** 2; if (d < bd) { bd = d; best = i; } }
    if (c.idx > NC * 0.8 && best < NC * 0.2) { c.lap++; if (c.lap >= 1 && !c.done) onLap(c); }
    else if (c.idx < NC * 0.2 && best > NC * 0.8) c.lap--;
    c.idx = best; c.off = Math.sqrt(bd);
  }
  function onLap(c) {
    if (c.lap >= LAPS) {
      c.done = true; c.time = t; c.steer = 0;
      if (!firstDone) { firstDone = t; banner = { text: `🏆 ${c.p.name} ניצח/ה!`, t: 2.5, color: c.p.color }; }
      send(c.p, { t: 'buzz', ms: [80, 50, 80] }); Music.sfx('hit');
      if (!c.p.bot) sendUI(c.p, g.uiFor(c.p));
    } else if (!c.p.bot) { send(c.p, { t: 'buzz', ms: 40 }); if (c.lap === LAPS - 1) banner = { text: `${c.p.name} · הקפה אחרונה! 🔥`, t: 1.5, color: c.p.color }; }
  }
  const progress = c => c.done ? 1e9 - c.time : c.lap * NC + c.idx;
  function finish() {
    ended = true;
    g.result = list.slice().sort((a, b) => progress(b) - progress(a)).map(c => ({ p: c.p, label: c.done ? `${c.time.toFixed(1)} שנ׳` : `הקפה ${Math.max(1, c.lap + 1)}/${LAPS}` }));
  }
  function botDrive(c, dt) {
    const look = C[(c.idx + 14) % NC], nrm = dirAt((c.idx + 14) % NC) + Math.PI / 2;
    const tx = look[0] + Math.cos(nrm) * c.botOff, ty = look[1] + Math.sin(nrm) * c.botOff;
    let da = Math.atan2(ty - c.y, tx - c.x) - c.ang; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
    c.steer = Math.abs(da) < 0.06 ? 0 : Math.sign(da);
    c.botTurboT -= dt;
    if (c.botTurboT <= 0 && c.turbo > 0 && Math.abs(da) < 0.1) { c.turbo--; c.turboT = 1.3; c.botTurboT = rand(6, 12); }
    if (Math.random() < dt * 0.3) c.botOff = rand(-40, 40);
  }
  const g = {
    uiFor(p) {
      const c = list.find(c => c.p === p); if (!c) return null;
      if (c.done) return { ui: 'wait', text: `🏁 סיימת! מקום ${c.place}` };
      return { ui: 'race', turbo: c.turbo };
    },
    input(p, m) {
      const c = list.find(c => c.p === p); if (!c || c.done) return;
      if (typeof m.steer === 'number') c.steer = clamp(m.steer | 0, -1, 1);

    },
    update(dt) {

        c.turboT = Math.max(0, c.turboT - dt); c.padT = Math.max(0, c.padT - dt);

        }

        ctx.fillStyle = '#e67700'; for (const ox of [-22, 2]) { ctx.beginPath(); ctx.moveTo(ox, -22); ctx.lineTo(ox + 20, 0); ctx.lineTo(ox, 22); ctx.lineTo(ox + 8, 0); ctx.fill(); }

    },

}

// ====================================================================== GAME 11: shadow fight (1-on-1 silhouette brawler)
function createFight(ps) {

    u: { st: 0.09, ac: 0.1, rc: 0.3, range: 125, dmg: 9, kb: 300, up: 950, hs: 0.55, pose: 'upper' },

    upper: { lean: -0.15, aB: [0.3, 1.8], aF: [2.7, 3.0], lB: [-0.3, -0.1], lF: [0.5, 0.2] },
    kick: { lean: -0.4, aB: [-0.6, 0.3], aF: [0.4, 1.6], lB: [-0.15, -0.1], lF: [1.55, 1.6] },
    airkick: { lean: -0.3, aB: [-0.4, 0.5], aF: [0.5, 1.8], lB: [0.2, -0.9], lF: [1.4, 1.5] },
    jump: { lean: 0.1, aB: [0.8, 2.4], aF: [1.1, 2.6], lB: [0.3, -0.7], lF: [1.2, 0.1] },

  const KING = queue.length >= 3, NEED_ROUNDS = KING ? 1 : 2, NEED_WINS = 3;

  let hitstop = 0, slowmo = 0, shake = 0, banner = null, t = 0;

    } else {

      fx.push({ type: 'spark', x: o.x - f.face * 25, y: hy, c: '#fff3bf', t: 0, life: 0.3, big: f.atkId === 's' || f.atkId === 'u' });
      hitstop = f.atkId === 's' ? 0.14 : 0.06; shake = Math.min(1, shake + a.dmg / 25);
      Music.sfx(a.dmg >= 9 ? 'boom' : 'hit', 0.4); send(o.p, { t: 'buzz', ms: 60 }); send(f.p, { t: 'buzz', ms: 15 });

  function ko(o) {

    banner = { text: 'נוקאאוט!', t: 2.2, big: true };

  }
  function timeUp() {

    if (w) w.rw++;

  }

    uiFor(p) {

    },
    update(dt) {

  }
  function playStep(s, t) {
    const sp = 60 / cur.bpm / 4;
    for (const v of cur.voices) { const n = v.notes[s]; if (n != null) tone(t, n, sp * v.dur * 0.95, v.type, v.vol); }
    const d = cur.drums || {}, k = s % 16;
    if (d.k && d.k[k] === 'x') kick(t);
    if (d.s && d.s[k] === 'x') noise(t, 0.14, 0.3, 'bandpass', 1800);
    if (d.h && d.h[k] === 'x') noise(t, 0.04, 0.09, 'highpass', 7000);
  }
  function tick() {
    if (!ac || !cur || ac.state !== 'running') { if (ac) nextT = ac.currentTime + 0.05; return; }
    if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;
    while (nextT < ac.currentTime + 0.12) { playStep(step, nextT); nextT += 60 / cur.bpm / 4; step = (step + 1) % cur.len; }
  }
  function sfx(type, size = 1) {
    if (!ac || ac.state !== 'running' || !enabled) return;
    const t = ac.currentTime + 0.01;
    if (type === 'boom') { kick(t); noise(t, 0.5 + size * 0.5, 0.6 * size + 0.2, 'lowpass', 500); }
    else if (type === 'splash') noise(t, 0.45, 0.35, 'bandpass', 900);
    else if (type === 'shot') { noise(t, 0.12, 0.5, 'highpass', 2000); kick(t); }
    else if (type === 'whoosh') noise(t, 0.5, 0.25, 'bandpass', 2500);
    else if (type === 'thump') { kick(t); }
    else if (type === 'hit') { tone(t, 72, 0.12, 'square', 0.12); tone(t + 0.08, 67, 0.15, 'square', 0.1); }
    else if (type === 'click') tone(t, 84, 0.06, 'triangle', 0.15);
  }
  return {
    sfx,
    play(name) { init(); if (cur === TRACKS[name]) return; cur = TRACKS[name] || null; step = 0; if (ac) nextT = ac.currentTime + 0.08; },
    unlock() { init(); if (ac && ac.state !== 'running') ac.resume().then(updateMusicHint).catch(() => {}); },
    get running() { return !!ac && ac.state === 'running'; },
    get enabled() { return enabled; },
    toggle() { enabled = !enabled; if (master) master.gain.setTargetAtTime(enabled ? 0.5 : 0, ac.currentTime, 0.05); return enabled; },
  };
})();

function updateMusicHint() {
  const h = $('musicHint'); if (!h) return;
  h.hidden = Music.running || !Music.enabled;
}
['keydown', 'pointerdown', 'click', 'touchstart'].forEach(ev => window.addEventListener(ev, () => { Music.unlock(); setTimeout(updateMusicHint, 300); }));
